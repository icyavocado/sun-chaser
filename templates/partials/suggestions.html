{{define "suggestions"}}
{{if .}}
<ul role="listbox" class="suggestions-list">
  {{range .}}
  <li role="option">
    <a href="#" class="suggestion-btn"
       onclick="selectLocation({{.DisplayName | js}}, {{.Lat}}, {{.Lon}}); return false;">
      {{.DisplayName}}
    </a>
  </li>
  {{end}}
</ul>
{{end}}
{{end}}
