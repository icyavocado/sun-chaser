name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Checkout calcbright sibling module
      uses: actions/checkout@v4
      with:
        repository: icyavocado/calcbright
        path: calcbright
    - name: Prepare parent build context
      run: |
        rm -rf ../calcbright
        cp -a calcbright ../calcbright
    - name: Build the Docker image
      working-directory: ..
      run: docker build . --file sun-chaser/Dockerfile --tag my-image-name:$(date +%s)
