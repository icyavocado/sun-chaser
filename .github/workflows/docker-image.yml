name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Clone calcbright sibling module
      run: git clone --depth 1 https://github.com/icyavocado/calcbright ../calcbright
    - name: Build the Docker image
      run: docker build .. --file Dockerfile --tag my-image-name:$(date +%s)
