name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PARENT_WORKSPACE: ${{ github.workspace }}/..
      IMAGE_NAME: icyavocado/sun-chaser

    steps:
    - uses: actions/checkout@v4
    - name: Checkout calcbright sibling module
      uses: actions/checkout@v4
      with:
        repository: icyavocado/calcbright
        path: calcbright
    - name: Prepare parent build context
      run: |
        test -n "${PARENT_WORKSPACE:-}"
        test "$PARENT_WORKSPACE" != "/"
        rm -rf "$PARENT_WORKSPACE/calcbright"
        cp -a calcbright "$PARENT_WORKSPACE/calcbright"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha,prefix=sha-
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ${{ env.PARENT_WORKSPACE }}
        file: ${{ github.workspace }}/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
